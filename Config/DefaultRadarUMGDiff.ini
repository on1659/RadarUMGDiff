; RadarUMGDiff 조절값 — 빌드 없이 고치고 에디터를 다시 켜면 반영된다.
; C++ (URadarUMGDiffSettings) 와 Python 분석기(radar_umgdiff/config.py)가 같은 파일을 읽는다.
; 문법: Key=Value, 배열은 +Key=값 을 줄마다 반복, 색은 (R=,G=,B=,A=) 0~1.

[/Script/RadarUMGDiffEditor.RadarUMGDiffSettings]
ColorAdded=(R=0.250000,G=0.850000,B=0.350000,A=1.000000)
ColorRemoved=(R=0.950000,G=0.200000,B=0.200000,A=1.000000)
ColorChanged=(R=1.000000,G=0.800000,B=0.150000,A=1.000000)
ColorMoved=(R=0.300000,G=0.550000,B=1.000000,A=1.000000)
ColorSelected=(R=1.000000,G=1.000000,B=1.000000,A=1.000000)

OutlineThickness=2.0
HaloThickness=1.0
RemovedBoxDashLength=6.0
DimUnchangedOpacity=0.55
OverlayOpacity=0.5

; SideBySide | Overlay | Flip
DefaultPreviewMode=SideBySide
bExecutePreConstruct=False

; 이름 변경 추정 문턱(동일 속성 비율), 수치 비교 허용 오차(상대)
RenameThreshold=0.8
FloatTolerance=1e-6
DoubleTolerance=1e-12

; 비교에서 아예 빼는 엔진 내부 속성
+IgnoredProperties=WidgetGeneratedBy
+IgnoredProperties=bCreatedByConstructionScript

; 디자이너가 자동으로 바꾸기도 하는 속성 — diff 에는 auto 표시로 남고, 뷰어 "자동 값 숨기기"(기본 bHideAutoDefault) 로 가린다
+AutoProperties=DesignerFlags
+AutoProperties=bIsVariable

; 한 줄(성분 강조)로 보이는 잎 구조체. 여기 없는 구조체는 멤버마다 한 줄이 된다 (C++·Python 공통)
+LeafStructs=LinearColor
+LeafStructs=Color
+LeafStructs=Vector2D
+LeafStructs=DeprecateSlateVector2D
+LeafStructs=Vector
+LeafStructs=Vector4
+LeafStructs=IntPoint
+LeafStructs=IntVector
+LeafStructs=Rotator
+LeafStructs=Quat
+LeafStructs=Margin
+LeafStructs=Box2D
+LeafStructs=Anchors
+LeafStructs=Guid

; 프로젝트 기준. /Temp/ 마운트(Saved/) 아래여야 한다
TempDir=Saved/Diff
bKeepTempPackages=False

NextKey=F8
PrevKey=F7
FlipKey=SpaceBar
bChangedOnlyDefault=True
bDimUnchangedDefault=True
bHideAutoDefault=True

; 엔진 폴더(Engine/) 기준 상대 경로 또는 절대 경로
PythonExe=Binaries/ThirdParty/Python3/Win64/python.exe
GitExe=git
